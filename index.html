<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>トラサンAI Live</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px; border-radius: 12px; font-size: 1.3rem; }
    .user { align-self: flex-end; background-color: #007aff; }
    .bot { align-self: flex-start; background-color: #2c2c2e; }
    #input-area { padding: 15px; background: #1e1e1e; display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border-radius: 8px; }
    button { padding: 10px 15px; border-radius: 8px; border: none; background: #34c759; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="chat-box"></div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="メッセージを入力...">
    <button onclick="sendMessage()">送信</button>
    <button onclick="startVoiceInput()" style="background:#ff9500;">マイク</button>
  </div>

  <script>
    // AQ.Ab8RN6LnQLlqNwZAty95svsnqY8JM8YJYFZWe8JRuAwrtjIP3A
    const API_KEY = "お前のAPIキーをここに入力してくれ"; 

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      input.value = '';
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-light:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
        });
        const data = await response.json();
        if (data.candidates && data.candidates[0]) {
            const botReply = data.candidates[0].content.parts[0].text;
            appendMessage(botReply, 'bot');
            const speech = new SpeechSynthesisUtterance(botReply);
            speech.lang = 'ja-JP';
            window.speechSynthesis.speak(speech);
        } else {
            appendMessage("エラー詳細: " + JSON.stringify(data), 'bot');
        }
      } catch (err) {
        appendMessage("エラー: " + err.message, 'bot');
      }
    }

    function startVoiceInput() {
      const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      rec.lang = 'ja-JP';
      rec.onresult = (e) => {
        document.getElementById('user-input').value = e.results[0][0].transcript;
        sendMessage();
      };
      rec.start();
    }

    function appendMessage(text, sender) {
      const box = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = text;
      box.appendChild(msg);
    }
  </script>
</body>
</html>
