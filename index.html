<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トラサンAI Live</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #header { padding: 15px; background: #1e1e1e; text-align: center; font-size: 1.5rem; font-weight: bold; border-bottom: 1px solid #333; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 1.3rem; line-height: 1.5; }
    .user { align-self: flex-end; background-color: #007aff; color: white; }
    .bot { align-self: flex-start; background-color: #2c2c2e; color: white; }
    #input-area { padding: 15px; background: #1e1e1e; display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
    button { padding: 12px 20px; font-size: 1.1rem; border-radius: 8px; border: none; background: #34c759; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <div id="header">トラサンAI Live</div>
  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="メッセージを入力...">
    <button onclick="sendMessage()">送信</button>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6LnQLlqNwZAty95svsnqY8JM8YJYFZWe8JRuAwrtjIP3A"; // ここにキーを入れてくれ

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });
        
        const data = await response.json();
        console.log("【デバッグ用】全データ:", data);
        
        if (data.candidates && data.candidates[0] && data.candidates[0].content) {
            const botReply = data.candidates[0].content.parts[0].text;
            appendMessage(botReply, 'bot');
          const speech = new SpeechSynthesisUtterance(botReply);
        speech.lang = 'ja-JP';
        window.speechSynthesis.speak(speech);
        } else {
            appendMessage("AIの返事が空だ！中身:" + JSON.stringify(data), 'bot');
        }
      } catch (err) {
        console.error("【エラー詳細】:", err);
        appendMessage("エラーが発生したぞ。詳細はコンソールを見ろ！: " + err.message, 'bot');
      }
    }

    function appendMessage(text, sender) {
      const box = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
